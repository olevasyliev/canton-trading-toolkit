[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canton_toolkit"
version = "0.2.0"
description = "Open-source algorithmic-trading toolkit for the Canton Network (Cantex venue connector)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cantex-sdk @ git+https://github.com/caviarnine/cantex_sdk",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# the Canton Venues example: its MCP server
venues = [
    "mcp>=2.2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canton_toolkit"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
