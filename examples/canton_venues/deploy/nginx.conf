# Static page + the JSON API the collector writes. certbot adds the 443 block on first deploy.
server {
    listen 80;
    listen [::]:80;
    server_name canton.46-225-216-13.nip.io;

    root /var/www/canton-venues;
    index index.html;
    access_log /var/log/nginx/canton-venues.access.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /api/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
