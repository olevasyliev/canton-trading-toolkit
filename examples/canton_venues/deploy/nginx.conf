# conf-version: 7
# cantonvenues.com serves the page and the JSON API; the old nip.io host is a
# permanent redirect. certbot adds the 443 blocks on the first deploy of this version.

# the contact form: a handful of messages a minute per IP is plenty
limit_req_zone $binary_remote_addr zone=venues_contact:1m rate=3r/m;
server {
    listen 80;
    listen [::]:80;
    server_name cantonvenues.com www.cantonvenues.com;

    root /var/www/canton-venues;
    index index.html;
    access_log /var/log/nginx/canton-venues.access.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=venues_contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
        try_files $uri =404;
    }

    # MCP over streamable HTTP, served by canton-venues-mcp on 127.0.0.1:8097
    location = /mcp {
        # a person opening the link in a browser gets the docs, not the protocol's ping stream;
        # MCP clients ask for text/event-stream or application/json, never text/html
        if ($http_accept ~* "text/html") { return 302 https://cantonvenues.com/#api; }
        proxy_pass http://127.0.0.1:8097/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # the page changes with every deploy: browsers revalidate it (a 304 when unchanged)
    location = /index.html { add_header Cache-Control "no-cache"; }

    # a page per venue, rewritten by the collector every tick; its card.png every few ticks
    location ^~ /venues/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name canton.46-225-216-13.nip.io;
    access_log /var/log/nginx/canton-venues.access.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://cantonvenues.com$request_uri; }
}
